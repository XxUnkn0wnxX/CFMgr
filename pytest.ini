[pytest]
minversion = 9.1
testpaths = tests
addopts = -ra --strict-config --strict-markers --durations=20 --durations-min=1
markers =
    unit: focused development helper behavior
    integration: isolated shell subprocess behavior
    busybox: actual BusyBox shell/applet execution (requires --busybox)
    matrix(*ids, evidence): PLAN validation IDs and evidence level (harness, host, busybox)
