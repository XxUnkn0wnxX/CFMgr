name: Tools Checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Tools Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run complete optional developer tools checks
        uses: ./.github/actions/module-checks
        with:
          batch: tooling
          reuse-preflight: false
