name: Lint

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up pinned ShellCheck
        uses: ./.github/actions/setup-shellcheck

      - name: Run ShellCheck lint
        run: |
          echo "OPTIONAL lint for $GITHUB_SHA"
          /usr/bin/time -v python3 tools/test.py --shellcheck-only
