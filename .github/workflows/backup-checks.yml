name: Backup Checks

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse-preflight:
        description: Reuse this same commit's successful common Checks preflight
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Backup Checks (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [host, busybox]
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run complete backup checks
        uses: ./.github/actions/module-checks
        with:
          batch: backup
          platform: ${{ matrix.platform }}
          reuse-preflight: ${{ inputs.reuse-preflight || false }}
