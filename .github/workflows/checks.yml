name: Checks

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - '.images/**'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - '.images/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Common source and shell preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.partition.outputs.matrix }}

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate complete core partition
        id: partition
        run: |
          matrix="$(python3 tools/test.py --core-matrix)"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"

      - name: Restore and verify developer tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: coreutils curl e2fsprogs gcc jq libc6-dev make mount openssl sudo time util-linux
          python-tools: 'true'

      - name: Prepare verified native vendor BusyBox
        uses: ./.github/actions/setup-busybox

      - name: Run common checks and host syntax
        run: |
          echo "CORE common checks for $GITHUB_SHA"
          /usr/bin/time -v .venv/bin/python tools/test.py --checks-only --skip-shellcheck

      - name: Run mandatory BusyBox syntax
        run: |
          export PATH="$GITHUB_WORKSPACE/.tmp/native-busybox/bin:$PATH"
          /usr/bin/time -v .venv/bin/python tools/test.py --checks-only --require-busybox --reuse-static

  core:
    name: Core ${{ matrix.owner }} / ${{ matrix.batch }}
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Restore and verify developer tools
        id: tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: coreutils curl e2fsprogs gcc jq libc6-dev make mount openssl sudo time util-linux
          python-tools: 'true'

      - name: Prepare verified native vendor BusyBox
        id: busybox
        uses: ./.github/actions/setup-busybox

      - name: Run complete assigned host batch
        env:
          CFMGR_CORE_BATCH: ${{ matrix.batch }}
        run: |
          echo "CORE host batch $CFMGR_CORE_BATCH for $GITHUB_SHA"
          /usr/bin/time -v .venv/bin/python tools/test.py --core-batch "$CFMGR_CORE_BATCH" --reuse-preflight

      - name: Run complete assigned BusyBox batch
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && steps.busybox.outcome == 'success' }}
        env:
          CFMGR_CORE_BATCH: ${{ matrix.batch }}
        run: |
          export PATH="$GITHUB_WORKSPACE/.tmp/native-busybox/bin:$PATH"
          echo "CORE BusyBox batch $CFMGR_CORE_BATCH for $GITHUB_SHA"
          /usr/bin/time -v .venv/bin/python tools/test.py --core-batch "$CFMGR_CORE_BATCH" --require-busybox --reuse-preflight

  checks:
    # Keep the required check display name stable for branch protection.
    name: Ubuntu 24.04 host and BusyBox checks
    needs: [preflight, core]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every core stage
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          CORE_RESULT: ${{ needs.core.result }}
        run: |
          python3 - <<'PY'
          import os

          results = {name: os.environ.get(name, "missing") for name in ("PREFLIGHT_RESULT", "CORE_RESULT")}
          for name, result in results.items():
              print(f"{name}: {result}")
          if any(result != "success" for result in results.values()):
              raise SystemExit("Every required preflight and core batch must succeed")
          PY
