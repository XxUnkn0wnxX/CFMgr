name: Checks

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
      - '**/.gitkeep'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
      - '**/.gitkeep'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning:
    name: Planning consistency (no runtime acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run standard-library planning checks
        run: |
          python3 --version
          python3 tools/check.py
          git diff --check

  host-runtime:
    name: Host runtime and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Restore and verify developer tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: jq shellcheck
          python-tools: 'true'

      - name: Run full host suite and static checks
        run: .venv/bin/python tools/test.py

  busybox:
    name: Linux BusyBox ash runtime suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Restore and verify developer tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: jq shellcheck
          python-tools: 'true'

      - name: Identify native vendor BusyBox cache key
        id: fixture
        run: python3 tools/test_platforms.py --native-busybox --cache-keys >> "$GITHUB_OUTPUT"

      - name: Restore verified native vendor BusyBox
        id: busybox-cache
        # actions/cache v4, official tag resolved 2026-10-12
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/busybox/${{ steps.fixture.outputs.busybox }}
          key: platform-native-busybox-v1-${{ steps.fixture.outputs.busybox }}

      - name: Build and stage native vendor BusyBox with fsync
        run: python3 tools/test_platforms.py --native-busybox

      - name: Run full suite with mandatory BusyBox ash storage proof
        run: |
          export PATH="$GITHUB_WORKSPACE/.tmp/native-busybox/bin:$PATH"
          .venv/bin/python tools/test.py --require-busybox

      - name: Save completed native vendor BusyBox even after test failure
        if: >-
          ${{ always() && steps.fixture.outcome == 'success' &&
              steps.busybox-cache.outputs.cache-hit != 'true' &&
              hashFiles(format('.tmp/platform-cache/busybox/{0}/verified.json', steps.fixture.outputs.busybox)) != '' &&
              hashFiles(format('.tmp/platform-cache/busybox/{0}/busybox', steps.fixture.outputs.busybox)) != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/busybox/${{ steps.fixture.outputs.busybox }}
          key: platform-native-busybox-v1-${{ steps.fixture.outputs.busybox }}

  kernel-platforms:
    name: ARM guest kernel ${{ matrix.kernel }} / pinned vendor BusyBox
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        kernel: ['4.1.51', '4.1.52', '4.19.183', '4.19.294']

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select bounded guest build tools
        id: packages
        env:
          CFMGR_KERNEL: ${{ matrix.kernel }}
        run: |
          compiler_package_words="$(python3 -c 'import os; from tools.test_platforms import load_manifest, kernel_toolchain; manifest = load_manifest(); kernel = next(item for item in manifest["kernels"] if item["version"] == os.environ["CFMGR_KERNEL"]); print(" ".join(kernel_toolchain(manifest, kernel)["host_packages"]))')"
          echo "apt-packages=gcc-arm-linux-gnueabi libc6-dev-armel-cross qemu-system-arm bc bison flex libssl-dev e2fsprogs $compiler_package_words" >> "$GITHUB_OUTPUT"

      - name: Restore and verify bounded guest build tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: ${{ steps.packages.outputs.apt-packages }}

      - name: Identify immutable build cache keys
        id: fixture
        env:
          CFMGR_KERNEL: ${{ matrix.kernel }}
        run: |
          python3 tools/test_platforms.py --cache-keys --kernel "$CFMGR_KERNEL" >> "$GITHUB_OUTPUT"

      - name: Restore selected shared compiler bundle
        id: compiler-cache
        # actions/cache v4, official tag resolved 2026-10-12
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/compiler-inputs/${{ steps.fixture.outputs.compiler }}
          key: platform-compiler-inputs-v1-${{ steps.fixture.outputs.compiler }}

      - name: Verify prebuilt compiler with a tiny C probe
        id: compiler-ready
        env:
          CFMGR_KERNEL: ${{ matrix.kernel }}
        run: python3 tools/test_platforms.py --prepare-compiler --kernel "$CFMGR_KERNEL"

      - name: Save complete compiler inputs before further work
        if: >-
          ${{ steps.compiler-ready.outcome == 'success' &&
              steps.compiler-cache.outputs.cache-hit != 'true' &&
              hashFiles(format('.tmp/platform-cache/compiler-inputs/{0}/verified.json', steps.fixture.outputs.compiler)) != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/compiler-inputs/${{ steps.fixture.outputs.compiler }}
          key: platform-compiler-inputs-v1-${{ steps.fixture.outputs.compiler }}

      - name: Restore shared pinned Entware archives
        id: feeds-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/feed-inputs/${{ steps.fixture.outputs.feeds }}
          key: platform-feed-inputs-v1-${{ steps.fixture.outputs.feeds }}

      - name: Verify complete pinned Entware archives
        id: feeds-ready
        run: python3 tools/test_platforms.py --prepare-feeds

      - name: Save complete feed inputs before builds and guests
        if: >-
          ${{ steps.feeds-ready.outcome == 'success' &&
              steps.feeds-cache.outputs.cache-hit != 'true' &&
              hashFiles(format('.tmp/platform-cache/feed-inputs/{0}/verified.json', steps.fixture.outputs.feeds)) != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/feed-inputs/${{ steps.fixture.outputs.feeds }}
          key: platform-feed-inputs-v1-${{ steps.fixture.outputs.feeds }}

      - name: Restore pinned vendor BusyBox builds
        id: busybox-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/busybox/${{ steps.fixture.outputs.busybox }}
          key: platform-busybox-v1-${{ steps.fixture.outputs.busybox }}

      - name: Restore verified generic kernel image
        id: kernel-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/kernels/${{ matrix.kernel }}/${{ steps.fixture.outputs.kernel }}
          key: platform-kernel-v1-${{ matrix.kernel }}-${{ steps.fixture.outputs.kernel }}

      - name: Restore pinned source only when kernel build is needed
        id: source-cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/kernel-inputs/${{ steps.fixture.outputs.source }}/linux-${{ matrix.kernel }}.tar.xz
          key: platform-kernel-source-v1-${{ steps.fixture.outputs.source }}

      - name: Verify source archive before kernel build
        id: source-ready
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        env:
          CFMGR_KERNEL: ${{ matrix.kernel }}
        run: python3 tools/test_platforms.py --prepare-kernel-source --kernel "$CFMGR_KERNEL"

      - name: Save verified source archive before builds and guests
        if: >-
          ${{ steps.source-ready.outcome == 'success' &&
              steps.source-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/kernel-inputs/${{ steps.fixture.outputs.source }}/linux-${{ matrix.kernel }}.tar.xz
          key: platform-kernel-source-v1-${{ steps.fixture.outputs.source }}

      - name: Boot actual kernel and execute both Entware ARM ABIs
        env:
          CFMGR_KERNEL: ${{ matrix.kernel }}
        run: python3 tools/test_platforms.py --run --kernel "$CFMGR_KERNEL"

      - name: Save completed vendor BusyBox even after guest failure
        if: >-
          ${{ always() && steps.fixture.outcome == 'success' &&
              steps.busybox-cache.outputs.cache-hit != 'true' &&
              hashFiles(format('.tmp/platform-cache/busybox/{0}/verified.json', steps.fixture.outputs.busybox)) != '' &&
              hashFiles(format('.tmp/platform-cache/busybox/{0}/busybox', steps.fixture.outputs.busybox)) != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/busybox/${{ steps.fixture.outputs.busybox }}
          key: platform-busybox-v1-${{ steps.fixture.outputs.busybox }}

      - name: Save completed kernel image even after guest failure
        if: >-
          ${{ always() && steps.fixture.outcome == 'success' &&
              steps.kernel-cache.outputs.cache-hit != 'true' &&
              hashFiles(format('.tmp/platform-cache/kernels/{0}/{1}/verified.json', matrix.kernel, steps.fixture.outputs.kernel)) != '' &&
              hashFiles(format('.tmp/platform-cache/kernels/{0}/{1}/Image', matrix.kernel, steps.fixture.outputs.kernel)) != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/kernels/${{ matrix.kernel }}/${{ steps.fixture.outputs.kernel }}
          key: platform-kernel-v1-${{ matrix.kernel }}-${{ steps.fixture.outputs.kernel }}
