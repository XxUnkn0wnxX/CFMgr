name: Checks

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
      - '**/.gitkeep'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
      - '**/.gitkeep'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning:
    name: Planning consistency (no runtime acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run standard-library planning checks
        run: |
          python3 --version
          python3 tools/check.py
          git diff --check

  host-runtime:
    name: Host runtime and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes shellcheck

      - name: Install pinned developer tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.txt

      - name: Run full host suite and static checks
        run: .venv/bin/python tools/test.py

  busybox:
    name: Linux BusyBox ash runtime suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install BusyBox and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes busybox shellcheck

      - name: Install pinned developer tools
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement requirements-dev.txt

      - name: Run full suite with mandatory BusyBox ash storage proof
        run: .venv/bin/python tools/test.py --require-busybox
