name: Checks

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - '.images/**'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - '.images/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ubuntu 24.04 host and BusyBox checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run planning consistency checks
        run: |
          python3 --version
          python3 tools/check.py
          git diff --check

      - name: Restore and verify developer tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: coreutils curl e2fsprogs gcc jq libc6-dev make mount openssl sudo time util-linux
          python-tools: 'true'

      - name: Prepare verified native vendor BusyBox
        uses: ./.github/actions/setup-busybox

      - name: Run core host suite and common checks
        run: |
          echo "CORE host checks for $GITHUB_SHA"
          /usr/bin/time -v .venv/bin/python tools/test.py --skip-shellcheck

      - name: Run core suite with mandatory BusyBox ash checks
        run: |
          export PATH="$GITHUB_WORKSPACE/.tmp/native-busybox/bin:$PATH"
          echo "CORE BusyBox checks for $GITHUB_SHA"
          /usr/bin/time -v .venv/bin/python tools/test.py --require-busybox --reuse-static
