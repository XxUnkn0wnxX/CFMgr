name: Checks

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
      - '**/.gitkeep'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
      - '**/.gitkeep'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: >-
      ${{ github.event_name != 'push' ||
          !contains(github.event.head_commit.message, 'CFMgr-Quick-Tests') }}
    name: Ubuntu 24.04 host and BusyBox checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run planning consistency checks
        run: |
          python3 --version
          python3 tools/check.py
          git diff --check

      - name: Restore and verify developer tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: coreutils curl e2fsprogs gcc jq libc6-dev make mount openssl sudo util-linux
          python-tools: 'true'

      - name: Prepare verified native vendor BusyBox
        uses: ./.github/actions/setup-busybox

      - name: Run full host suite and static checks
        run: |
          echo "FULL host checks for $GITHUB_SHA"
          .venv/bin/python tools/test.py

      - name: Run full suite with mandatory BusyBox ash checks
        run: |
          export PATH="$GITHUB_WORKSPACE/.tmp/native-busybox/bin:$PATH"
          echo "FULL BusyBox checks for $GITHUB_SHA"
          .venv/bin/python tools/test.py --require-busybox
