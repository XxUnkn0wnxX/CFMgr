name: Checks

on:
  push:
    branches: [develop]
    paths:
      - cfmgr
      - cfmgr.sh
      - modules/**
      - src/**
      - tests/**
      - tools/**
      - requirements-dev.txt
      - pytest.ini
      - ruff.toml
      - .github/workflows/checks.yml
      - '!**/*.md'
  pull_request:
    branches: [develop]
    paths:
      - cfmgr
      - cfmgr.sh
      - modules/**
      - src/**
      - tests/**
      - tools/**
      - requirements-dev.txt
      - pytest.ini
      - ruff.toml
      - .github/workflows/checks.yml
      - '!**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ubuntu 24.04 with BusyBox
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python 3.14.0
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: 3.14.0

      - name: Install runner check tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes busybox shellcheck gcc libc6-dev binutils make bzip2

      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt

      - name: Build supplemental BusyBox ash and flock
        timeout-minutes: 4
        run: |
          mkdir -p .tmp
          curl --fail --location --retry 2 --max-time 45 --output .tmp/busybox-1.36.1.tar.bz2 https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          printf '%s\n' 'b8cc24c9574d809e7279c3be349795c5d5ceb6fdf19ca709f80cde50e47de314  .tmp/busybox-1.36.1.tar.bz2' | sha256sum --check -
          tar -xjf .tmp/busybox-1.36.1.tar.bz2 -C .tmp
          make -C .tmp/busybox-1.36.1 allnoconfig
          # Reuse one small multicall build for real flock and stripped ash.
          # Disable the optional shell features absent from the matched firmware.
          sed -i \
            -e 's/^# CONFIG_BUSYBOX is not set$/CONFIG_BUSYBOX=y/' \
            -e 's/^# CONFIG_FLOCK is not set$/CONFIG_FLOCK=y/' \
            -e 's/^# CONFIG_TRUE is not set$/CONFIG_TRUE=y/' \
            -e 's/^# CONFIG_MKDIR is not set$/CONFIG_MKDIR=y/' \
            -e 's/^# CONFIG_WC is not set$/CONFIG_WC=y/' \
            -e 's/^# CONFIG_ENV is not set$/CONFIG_ENV=y/' \
            -e 's/^# CONFIG_PRINTF is not set$/CONFIG_PRINTF=y/' \
            -e 's/^# CONFIG_HEXDUMP is not set$/CONFIG_HEXDUMP=y/' \
            -e 's/^# CONFIG_TEST is not set$/CONFIG_TEST=y/' \
            -e 's/^# CONFIG_TEST1 is not set$/CONFIG_TEST1=y/' \
            -e 's/^# CONFIG_FEATURE_SH_MATH is not set$/CONFIG_FEATURE_SH_MATH=y/' \
            -e 's/^# CONFIG_ASH is not set$/CONFIG_ASH=y/' \
            -e 's/^CONFIG_ASH_CMDCMD=y$/# CONFIG_ASH_CMDCMD is not set/' \
            -e 's/^CONFIG_ASH_JOB_CONTROL=y$/# CONFIG_ASH_JOB_CONTROL is not set/' \
            -e 's/^CONFIG_ASH_PRINTF=y$/# CONFIG_ASH_PRINTF is not set/' \
            -e 's/^CONFIG_ASH_TEST=y$/# CONFIG_ASH_TEST is not set/' \
            -e 's/^CONFIG_ASH_ECHO=y$/# CONFIG_ASH_ECHO is not set/' \
            -e 's/^CONFIG_ASH_SLEEP=y$/# CONFIG_ASH_SLEEP is not set/' \
            -e 's/^CONFIG_FEATURE_SH_STANDALONE=y$/# CONFIG_FEATURE_SH_STANDALONE is not set/' \
            -e 's/^CONFIG_FEATURE_PREFER_APPLETS=y$/# CONFIG_FEATURE_PREFER_APPLETS is not set/' \
            -e 's/^CONFIG_SH_IS_NONE=y$/# CONFIG_SH_IS_NONE is not set/' .tmp/busybox-1.36.1/.config
          make -C .tmp/busybox-1.36.1 KBUILD_DEFCONFIG=.config defconfig
          grep -Fx 'CONFIG_BUSYBOX=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_FLOCK=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_TRUE=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_MKDIR=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_WC=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_ENV=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_PRINTF=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_HEXDUMP=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_TEST=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_TEST1=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_FEATURE_SH_MATH=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_ASH=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_SHELL_ASH=y' .tmp/busybox-1.36.1/.config
          grep -Fx 'CONFIG_SH_IS_ASH=y' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_SH_IS_NONE is not set' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_ASH_CMDCMD is not set' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_ASH_JOB_CONTROL is not set' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_ASH_PRINTF is not set' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_ASH_TEST is not set' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_ASH_ECHO is not set' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_ASH_SLEEP is not set' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_FEATURE_SH_STANDALONE is not set' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_FEATURE_PREFER_APPLETS is not set' .tmp/busybox-1.36.1/.config
          grep -Fx '# CONFIG_KILL is not set' .tmp/busybox-1.36.1/.config
          timeout 120s make -C .tmp/busybox-1.36.1 -j2 busybox
          cfmgr_busybox_applets=$(.tmp/busybox-1.36.1/busybox --list)
          printf '%s\n' "$cfmgr_busybox_applets"
          cfmgr_busybox_expected=$(printf '%s\n' '[' ash env flock hexdump mkdir printf sh test true wc)
          test "$(printf '%s\n' "$cfmgr_busybox_applets" | LC_ALL=C sort)" = "$cfmgr_busybox_expected"
          cfmgr_busybox_path="$PWD/.tmp/busybox-1.36.1/busybox"
          # These variables are deliberately expanded by the tested ash.
          # shellcheck disable=SC2016
          PATH='' "$cfmgr_busybox_path" sh -c '
            command true >/dev/null 2>&1; command_status=$?
            case $command_status in 127) : ;; *) exit 91 ;; esac
            printf x >/dev/null 2>&1; printf_status=$?
            case $printf_status in 127) : ;; *) exit 92 ;; esac
            kill -0 "$$" >/dev/null 2>&1; kill_status=$?
            case $kill_status in 127) : ;; *) exit 93 ;; esac
          '

      - name: Report tool versions
        run: |
          .venv/bin/python --version
          /usr/bin/busybox 2>&1 | sed -n '1p'
          .tmp/busybox-1.36.1/busybox 2>&1 | sed -n '1p'
          shellcheck --version

      - name: Run focused ash compatibility cases
        run: >-
          .venv/bin/python -m pytest -q -m busybox
          tests/test_worker.py tests/test_bootstrap.py tests/test_closure.py
          tests/test_supervision.py
          --busybox .tmp/busybox-1.36.1/busybox

      - name: Run checks
        run: .venv/bin/python tools/check.py --busybox /usr/bin/busybox --busybox-flock .tmp/busybox-1.36.1/busybox

      - name: Run isolated Linux kernel proof
        run: sudo -n .venv/bin/python tools/check_kernel.py --busybox /usr/bin/busybox
