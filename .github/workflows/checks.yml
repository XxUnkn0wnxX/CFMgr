name: Checks

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
      - '**/.gitkeep'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
      - '**/.gitkeep'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Ubuntu 24.04 host and BusyBox checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run planning consistency checks
        run: |
          python3 --version
          python3 tools/check.py
          git diff --check

      - name: Restore and verify developer tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: coreutils curl e2fsprogs jq mount openssl shellcheck sudo util-linux
          python-tools: 'true'

      - name: Select full or authorized focused test paths
        id: selection
        env:
          CFMGR_EVENT_NAME: ${{ github.event_name }}
          CFMGR_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from tools.test import focused_selection

          try:
              mode, paths = focused_selection(
                  os.environ.get("CFMGR_EVENT_NAME", ""),
                  os.environ.get("CFMGR_COMMIT_MESSAGE", ""),
              )
          except ValueError as error:
              raise SystemExit(f"Invalid focused-test trailer: {error}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
              output.write(f"paths={' '.join(paths)}\n")
          print(f"Selected {mode.upper()} checks; paths: {' '.join(paths) or '(all tests)'}")
          PY

      - name: Identify native vendor BusyBox cache key
        id: fixture
        run: python3 tools/test_platforms.py --native-busybox --cache-keys >> "$GITHUB_OUTPUT"

      - name: Restore verified native vendor BusyBox
        id: busybox-cache
        # actions/cache v4, official tag resolved 2026-10-12
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/busybox/${{ steps.fixture.outputs.busybox }}
          key: platform-native-busybox-v1-${{ steps.fixture.outputs.busybox }}

      - name: Build and stage native vendor BusyBox with fsync
        run: python3 tools/test_platforms.py --native-busybox

      - name: Run selected host suite and static checks
        env:
          CFMGR_TEST_MODE: ${{ steps.selection.outputs.mode }}
          CFMGR_TEST_PATHS: ${{ steps.selection.outputs.paths }}
        run: |
          case "$CFMGR_TEST_MODE" in
            focused)
              IFS=' ' read -r -a focused_paths <<< "$CFMGR_TEST_PATHS"
              echo "FOCUSED host checks: ${focused_paths[*]}"
              .venv/bin/python tools/test.py --focused "${focused_paths[@]}"
              ;;
            full)
              echo "FULL host checks"
              .venv/bin/python tools/test.py
              ;;
            *)
              echo "Invalid test mode: $CFMGR_TEST_MODE" >&2
              exit 2
              ;;
          esac

      - name: Run selected suite with mandatory BusyBox ash checks
        env:
          CFMGR_TEST_MODE: ${{ steps.selection.outputs.mode }}
          CFMGR_TEST_PATHS: ${{ steps.selection.outputs.paths }}
        run: |
          export PATH="$GITHUB_WORKSPACE/.tmp/native-busybox/bin:$PATH"
          case "$CFMGR_TEST_MODE" in
            focused)
              IFS=' ' read -r -a focused_paths <<< "$CFMGR_TEST_PATHS"
              echo "FOCUSED BusyBox checks: ${focused_paths[*]}"
              .venv/bin/python tools/test.py --focused "${focused_paths[@]}" --require-busybox
              ;;
            full)
              echo "FULL BusyBox checks"
              .venv/bin/python tools/test.py --require-busybox
              ;;
            *)
              echo "Invalid test mode: $CFMGR_TEST_MODE" >&2
              exit 2
              ;;
          esac

      - name: Save completed native vendor BusyBox even after test failure
        if: >-
          ${{ always() && steps.fixture.outcome == 'success' &&
              steps.busybox-cache.outputs.cache-hit != 'true' &&
              hashFiles(format('.tmp/platform-cache/busybox/{0}/verified.json', steps.fixture.outputs.busybox)) != '' &&
              hashFiles(format('.tmp/platform-cache/busybox/{0}/busybox', steps.fixture.outputs.busybox)) != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .tmp/platform-cache/busybox/${{ steps.fixture.outputs.busybox }}
          key: platform-native-busybox-v1-${{ steps.fixture.outputs.busybox }}
