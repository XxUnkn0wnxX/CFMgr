name: Checks

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
  pull_request:
    branches: [develop]
    paths-ignore:
      - '**/*.md'
      - '**/*.markdown'
      - 'docs/**'
      - '.images/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Common source and shell preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate complete core partition
        id: partition
        run: python3 tools/test.py --core-matrix

      - name: Restore and verify developer tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: coreutils curl e2fsprogs gcc jq libc6-dev make mount openssl sudo time util-linux
          python-tools: 'true'

      - name: Prepare verified native vendor BusyBox
        uses: ./.github/actions/setup-busybox

      - name: Run common checks and host syntax
        id: common
        run: |
          echo "CORE common checks for $GITHUB_SHA"
          /usr/bin/time -v .venv/bin/python tools/test.py --checks-only --skip-shellcheck

      - name: Run mandatory BusyBox syntax
        id: native_syntax
        run: |
          export PATH="$GITHUB_WORKSPACE/.tmp/native-busybox/bin:$PATH"
          /usr/bin/time -v .venv/bin/python tools/test.py --checks-only --require-busybox --reuse-static

  backup:
    name: Backup Checks
    needs: preflight
    uses: ./.github/workflows/backup-checks.yml
    with:
      reuse-preflight: true

  manager:
    name: Manager Checks
    needs: preflight
    uses: ./.github/workflows/manager-checks.yml
    with:
      reuse-preflight: true

  status:
    name: Status Checks
    needs: preflight
    uses: ./.github/workflows/status-checks.yml
    with:
      reuse-preflight: true

  checks:
    # Keep the required check display name stable for branch protection.
    name: Ubuntu 24.04 host and BusyBox checks
    needs: [preflight, backup, manager, status]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every core stage
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          BACKUP_RESULT: ${{ needs.backup.result }}
          MANAGER_RESULT: ${{ needs.manager.result }}
          STATUS_RESULT: ${{ needs.status.result }}
        run: |
          python3 - <<'PY'
          import os

          results = {name: os.environ.get(name, "missing") for name in ("PREFLIGHT_RESULT", "BACKUP_RESULT", "MANAGER_RESULT", "STATUS_RESULT")}
          for name, result in results.items():
              print(f"{name}: {result}")
          if any(result != "success" for result in results.values()):
              raise SystemExit("Every required preflight and core batch must succeed")
          PY
