name: Planning-only checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning:
    name: Planning consistency (no runtime acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Run standard-library planning checks
        run: |
          python3 --version
          python3 tools/check.py
          git diff --check
