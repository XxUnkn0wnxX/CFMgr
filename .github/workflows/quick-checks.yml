name: Quick Checks
run-name: "Quick Checks: ${{ inputs.label || 'selected CI evidence' }}"

on:
  workflow_dispatch:
    inputs:
      label:
        description: Short name for this focused or diagnostic group
        required: false
        type: string
      host_baseline:
        description: Run the complete host suite and common checks without BusyBox selection
        required: false
        default: false
        type: boolean
      test_nodes:
        description: Space-separated test modules or pytest node IDs (up to eight)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  quick-checks:
    name: Ubuntu 24.04 focused CI evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Select and validate quick test nodes
        if: ${{ inputs.host_baseline != true }}
        id: selection
        env:
          CFMGR_EVENT_NAME: ${{ github.event_name }}
          CFMGR_DISPATCH_NODES: ${{ inputs.test_nodes }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          from tools.test import quick_selection

          if os.environ.get("PYTEST_ADDOPTS", "").strip():
              raise SystemExit("PYTEST_ADDOPTS must be empty for visible quick-test selection")
          try:
              nodes = quick_selection(
                  os.environ.get("CFMGR_EVENT_NAME", ""),
                  "",
                  os.environ.get("CFMGR_DISPATCH_NODES", ""),
              )
          except ValueError as error:
              raise SystemExit(f"Invalid quick-test selection: {error}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write("nodes=" + " ".join(nodes) + "\n")
          PY

      - name: Run lightweight planning and package checks
        if: ${{ inputs.host_baseline != true }}
        run: |
          python3 tools/check.py
          python3 tools/package.py --check
          git diff --check

      - name: Restore and verify developer tools
        uses: ./.github/actions/setup-tools
        with:
          apt-packages: coreutils curl e2fsprogs gcc jq libc6-dev make mount openssl sudo time util-linux
          python-tools: 'true'

      - name: Prepare verified native vendor BusyBox
        if: ${{ inputs.host_baseline != true }}
        uses: ./.github/actions/setup-busybox

      - name: Run diagnostic-only full host baseline
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.host_baseline == true }}
        env:
          CFMGR_TESTED_SHA: ${{ github.sha }}
        run: |
          echo "DIAGNOSTIC HOST BASELINE ONLY — not main acceptance for $CFMGR_TESTED_SHA"
          /usr/bin/time -v .venv/bin/python tools/test.py --skip-shellcheck

      - name: Run focused pytest selection with BusyBox ash
        if: ${{ inputs.host_baseline != true }}
        env:
          CFMGR_QUICK_NODES: ${{ steps.selection.outputs.nodes }}
          CFMGR_TESTED_SHA: ${{ github.sha }}
        run: |
          export PATH="$GITHUB_WORKSPACE/.tmp/native-busybox/bin:$PATH"
          .venv/bin/python - <<'PY'
          import os
          import subprocess
          import sys

          if os.environ.get("PYTEST_ADDOPTS", "").strip():
              raise SystemExit("PYTEST_ADDOPTS must be empty for visible quick-test selection")
          try:
              from tools.test import quick_pytest_selection_args, validate_quick_nodes

              nodes = validate_quick_nodes(os.environ.get("CFMGR_QUICK_NODES", ""))
              selection_args = quick_pytest_selection_args(nodes)
          except ValueError as error:
              raise SystemExit(f"Invalid validated quick-test output: {error}")

          print(
              "FOCUSED CI EVIDENCE — diagnosis and interim evidence for selected "
              "core or optional tests. Published acceptance requires core Checks.",
              flush=True,
          )
          print(f"Tested SHA: {os.environ['CFMGR_TESTED_SHA']}", flush=True)
          print("Selected targets: " + " ".join(nodes), flush=True)
          if selection_args[:2] == ["-m", "not diagnostic"]:
              print("Whole-module selection excludes optional diagnostic cases.", flush=True)
          environment = os.environ.copy()
          environment["CFMGR_TEST_SHELL"] = "busybox ash"
          environment["CFMGR_REQUIRE_BUSYBOX"] = "1"
          environment["PYTEST_DISABLE_PLUGIN_AUTOLOAD"] = "1"
          command = [
              "/usr/bin/time",
              "-v",
              sys.executable,
              "-m",
              "pytest",
              "-vv",
              "-ra",
              "--strict-config",
              "--strict-markers",
              "--maxfail=1",
              "--durations=10",
              *selection_args,
          ]
          raise SystemExit(subprocess.run(command, check=False, env=environment).returncode)
          PY
