name: Set up verified native vendor BusyBox
description: Restore, verify, build if needed, and cache the native vendor BusyBox fixture.

runs:
  using: composite
  steps:
    - name: Identify native vendor BusyBox cache key
      id: fixture
      shell: bash
      run: python3 tools/test_platforms.py --native-busybox --cache-keys >> "$GITHUB_OUTPUT"

    - name: Restore verified native vendor BusyBox
      id: busybox-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .tmp/platform-cache/busybox/${{ steps.fixture.outputs.busybox }}
        key: platform-native-busybox-v1-${{ steps.fixture.outputs.busybox }}

    - name: Build and stage native vendor BusyBox
      id: build
      shell: bash
      run: python3 tools/test_platforms.py --native-busybox

    - name: Save verified native vendor BusyBox before tests
      if: >-
        ${{ success() && steps.build.outcome == 'success' &&
            steps.busybox-cache.outputs.cache-hit != 'true' &&
            hashFiles(format('.tmp/platform-cache/busybox/{0}/verified.json', steps.fixture.outputs.busybox)) != '' &&
            hashFiles(format('.tmp/platform-cache/busybox/{0}/busybox', steps.fixture.outputs.busybox)) != '' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .tmp/platform-cache/busybox/${{ steps.fixture.outputs.busybox }}
        key: platform-native-busybox-v1-${{ steps.fixture.outputs.busybox }}
